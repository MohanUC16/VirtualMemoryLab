<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Memory Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Operating Systems Lab</p>
        <h1>Virtual Memory: Paging and Segmentation</h1>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <h2>Part 1: Paging Exploration</h2>

        <div class="controls-grid">
          <label>
            Address space (bytes)
            <input id="addressSpace" type="number" value="1048576" min="1" />
          </label>
          <label>
            Page size (bytes)
            <input id="pageSize" type="number" value="1024" min="1" />
          </label>
          <label>
            Physical memory (bytes)
            <input id="physicalMemory" type="number" value="536870912" min="1" />
          </label>
          <label>
            Allocation percent
            <input id="allocPercent" type="number" value="50" min="0" max="100" />
          </label>
          <label>
            Random seed
            <input id="seed" type="number" value="1" min="0" />
          </label>
          <label>
            Entry size (bytes)
            <input id="entrySize" type="number" value="4" min="1" />
          </label>
        </div>

        <div class="buttons">
          <button id="pagingDemoBtn">Run paging scenario</button>
          <button id="pagingPresetBtn" class="secondary">Run suggested examples</button>
        </div>

        <div id="pagingOutput" class="output"></div>
      </section>

      <section class="card">
        <h2>Part 2: Segmentation Exploration</h2>

        <div class="controls-grid">
          <label>
            Virtual address space
            <input id="virtualSpace" type="number" value="128" min="1" />
          </label>
          <label>
            Physical memory size
            <input id="physicalSpace" type="number" value="512" min="1" />
          </label>
          <label>
            Segment 0 base
            <input id="seg0Base" type="number" value="0" />
          </label>
          <label>
            Segment 0 limit
            <input id="seg0Limit" type="number" value="20" min="0" />
          </label>
          <label>
            Segment 1 base
            <input id="seg1Base" type="number" value="512" />
          </label>
          <label>
            Segment 1 limit
            <input id="seg1Limit" type="number" value="20" min="0" />
          </label>
        </div>

        <div class="buttons">
          <button id="segmentationBtn">Translate addresses</button>
          <button id="segmentationInvalidBtn" class="secondary">Test invalid-case scenario</button>
        </div>

        <div id="segmentationOutput" class="output"></div>
      </section>

      <section class="card report-card">
        <h2>Lab Summary</h2>
        <div id="reportOutput" class="report-output"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
